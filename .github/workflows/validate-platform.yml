name: Validate Platform 2.0

on:
  push:
    branches:
      - platform-2.0
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify storefront output
        shell: bash
        run: |
          test -f _site/index.html
          test -f _site/products/valve-pressure-testing/index.html
          test -f _site/assets/css/platform-2.0.css
          test -f _site/404.html
          test -f _site/licensing/index.html
          test -f _site/welding-tools/index.html
          test -f _site/pages/enrollment-update/index.html
          if grep -R -q "https://payhip.com" _site; then
            echo "Payhip checkout links must not be included in the public site build."
            exit 1
          fi
          if find _site -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.zip' \) | grep -q .; then
            echo "Paid or print-ready files must not be included in the public site build."
            find _site -type f \( -iname '*.pdf' -o -iname '*.xlsx' -o -iname '*.zip' \)
            exit 1
          fi
