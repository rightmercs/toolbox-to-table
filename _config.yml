title: Toolbox to Table
description: Professional inspection tools, guides, and field resources built for industrial inspectors.
theme: minima
url: https://toolboxtotable.com
baseurl: ""

header_pages:
  - pages/books.md
  - pages/field-lessons.md
  - pages/training.md
  - pages/about.md
  - pages/contact.md

# Print-ready handbook source files are retained in the repository for now,
# but must never be copied into the public GitHub Pages build.
exclude:
  - "*.pdf"
  - "*.xlsx"
  - "*.xlsm"
  - "*.zip"
